name: Actualizar Activos de Datos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Script
        run: python main.py

      - name: Guardar y Forzar Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add styles.m3u
          if git diff --staged --quiet; then
            echo "Sin cambios, actualizando marca de tiempo..."
            echo "# Actualizado: $(date)" >> styles.m3u
            git add styles.m3u
          fi
          git commit -m "Actualizar lista styles.m3u [skip ci]" || exit 0
          git push
