name: Actualizar Activos de Datos

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Script de Limpieza y Generación
        run: python main.py

      - name: Forzar Commit y Push de los cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add settings.log styles.m3u
          # Si no hay cambios reales, forzamos un pequeño cambio en el archivo para que Git lo detecte
          if git diff --staged --quiet; then
            echo "Sin cambios en los archivos, forzando marca de tiempo..."
            echo "# Actualizado: $(date)" >> styles.m3u
            git add styles.m3u
          fi
          git commit -m "Auto-limpieza y actualización de lista m3u [skip ci]"
          git push
